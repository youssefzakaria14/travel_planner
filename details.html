<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Destination Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <style>
        body {
            background: #f5f7f8;
            font-family: Arial, sans-serif;
        }


        /* Back Button */

        .back-btn {
            background: white;
            color: #0bcac7;
            border: 2px solid #0bcac7;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #0bcac7;
            color: white;
            transform: translateX(-3px);
        }


        /* Hero */

        .hero {
            background: white;
            border-radius: 22px;
            overflow: hidden;
            margin-top: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }


        .hero img {
            width: 100%;
            height: 450px;
            object-fit: cover;
        }


        .hero-body {
            padding: 30px;
        }


        .hero-body h1 {
            color: #0bcac7;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .hero-body h4 {
            color: #28bebc;
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .hero-body p i {
            color: #186968;
            font-size: 22px;
            padding-right: 10px;
            
        }
           .hero-body p {
            color: #171818;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .hero-body .description{
              color: #185a5a;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px
        }

        /* Country */

        .country {
            color: #555;
            font-size: 17px;
        }

        .country i {
            color: #0bcac7;
            margin-right: 7px;
        }


        /* Rating */

        .rating {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff8df;
            padding: 7px 14px;
            border-radius: 20px;
            margin: 10px 0;
        }


        .rating i {
            color: #ffc107;
            font-size: 19px;
        }


        .rating span {
            color: #555;
            font-weight: 600;
        }


        /* Description */

        .description {
            color: #666;
            font-size: 16px;
            line-height: 1.8;
            margin-top: 10px;
        }


        /* Price */

        .price {
            color: #222;
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }


        .price span {
            color: #0bcac7;
        }


        /* Book Button */

        .book-btn {
            margin-top: 20px;
            padding: 13px 28px;
            border: none;
            border-radius: 30px;
            background: #0bcac7;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 18px rgba(11, 202, 199, 0.3);
        }


        .book-btn:hover {
            transform: translateY(-3px);
            background: #09aaa7;
            box-shadow: 0 9px 22px rgba(11, 202, 199, 0.4);
        }


        .book-btn i {
            margin-right: 8px;
        }
       

        /* Information Cards */

        .info-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-top: 22px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            transition: 0.3s;
        }
        

        .info-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.09);
        }


        .info-card h3 {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #222;
            font-size: 22px;
            margin-bottom: 15px;
        }


        .info-card h3 i {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8fbfa;
            color: #0bcac7;
            border-radius: 12px;
            font-size: 20px;
        }


        .info-card p {
            color: #666;
            line-height: 1.8;
            margin: 0;
            font-size: 16px;
        }


        /* Mobile */

        @media (max-width: 768px) {

            .hero img {
                height: 280px;
            }

            .hero-body {
                padding: 22px;
            }

            .hero-body h1 {
                font-size: 30px;
            }

            .info-card {
                padding: 20px;
            }

        }
    </style>

</head>


<body>


    <div class="container pb-5">


        <!-- Back -->

        <button class="back-btn mt-4" onclick="history.back()">

            <i class="bi bi-arrow-left"></i>

            Back

        </button>


        <!-- Details -->

        <div id="detailsContainer"></div>


    </div>


    <script src="details.js"></script>


</body>

</html>
