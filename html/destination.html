<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/destination.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>


<body>


    <nav class="navbar navbar-expand-lg bg-light shadow-sm bg-white mb-4">
        <div class="container d-flex align-items-center">

            <p class="navbar-brand fw-bold fs-3 mb-0" style="letter-spacing: 1px; color:#0ea5a8;" href="#">
                TripMate
            </p>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="destination.html">Destinations</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="mytrip.html">My Trip</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            About Us
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link myactive" href="services.html" class="text-danger fs-6">
                            Services
                        </a>
                    </li>

                </ul>

            </div>


        </div>
    </nav>


    <div class="container text-center mt-1 mb-5 fs-2">

        <h1 style="color:#0bcac7;">
            Explore Destinations
        </h1>

        <p class="text-black fs-5">
            Discover amazing places around the world and find
            your perfect destination for your next adventure.
        </p>
    </div>

    <div class="container">

        <!-- SEARCH -->

        <div class="search-filters row g-2 align-items-center">

            <div class="col-lg-11">

                <div class="search-input">

                    <span><i class="bi bi-search"></i></span>

                    <input type="text" id="searchInput" placeholder="Where do you want to go?">



                </div>
            </div>

            <div class="col-lg-1">

                <button id="searchBtn" class="btn w-100">
                    Search
                </button>

            </div>



        </div>
        <div id="error"></div>


        <!-- ============================= -->
        <!-- ADMIN -->
        <!-- ============================= -->

        <div class="container admin-area">

            <button id="newCardBtn" class="btn">
                New Card
            </button>


            <!-- FORM -->

            <div id="cardForm" style="display: none;">

                <input type="text" id="name" placeholder="Name">

                <input type="text" id="country" placeholder="Country">

                <input type="file" id="cardImage" accept="image/*">

                <input type="number" id="rating" placeholder="Rating">

                <input type="text" id="description" placeholder="Description">

                <input type="number" id="price" placeholder="Price">
                <textarea id="about" class="form-control mb-2" placeholder="About Destination"></textarea>

                <textarea id="thingsToDo" class="form-control mb-2" placeholder="Things To Do"></textarea>

                <textarea id="food" class="form-control mb-2" placeholder="Food"></textarea>

                <textarea id="hotels" class="form-control mb-2" placeholder="Best Hotels"></textarea>

                <input type="text" id="bestTime" class="form-control mb-2" placeholder="Best Time To Visit">

                <input type="text" id="travelTips" class="form-control mb-2" placeholder="Travel Tips">

                <select id="category">

                    <option value="trending">
                        Trending
                    </option>

                    <option value="coastal">
                        Coastal
                    </option>

                    <option value="adventure">
                        Adventure
                    </option>

                    <option value="cultural">
                        Cultural
                    </option>

                </select>


                <button id="saveBtn" class="btn">
                    Add Card
                </button>

            </div>

        </div>




        <div class="container boxing">

            <h2 class="not">Trending</h2>

            <div id="trendingContainer" class="row g-4"></div>




            <h2 class="not">Coastal</h2>

            <div id="coastalContainer" class="row"></div>




            <h2 class="not">Adventure</h2>

            <div id="adventureContainer" class="row"></div>




            <h2 class="not">Cultural</h2>

            <div id="culturalContainer" class="row"></div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script src="../js/destination.js"></script>


</body>

</html>
