<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>


<body>


    <section class="explore">

        <div class="container">
            <div class="exploer text-center mt-3 fs-3 " >
            <h1 style=" color: #12aaa8;"> Explore Destinations </h1>

                <p class="mt-3 mb-3 fs-5">
                    Find your next perfect getaway. From sun-drenched beaches to historic city <br> streets, adventure
                    awaits.
                </p>
            </div>
            <div class="container">
                <div class="search-filters row g-2 align-items-center mt-5">

                    <div class="col-12 col-lg">
                        <div class="search-input">
                            <span><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" placeholder="Where do you want to go?">
                        </div>
                    </div>

                    <div class="col-12 col-lg-auto">
                        <button id="searchBtn" class="btn w-100">
                            Search
                        </button>
                    </div>

                    

                </div>
            </div>
        </div>
        <div id="errors">
       <p id="error" class="text-danger"></p>
       </div>
    </section>
    


    <section class="destinations">

        <div class="container">

            <div class="section-title">
                <h2>Trending Destinations </h2>

            </div>


            <div id="trendingContainer" class="row g-4">
            </div>


            <div class="section-title">

                <h2> Coastal Getaways </h2>

            </div>

            <div id="coastalContainer" class="row g-4">
            </div>

            <div class="section-title">

                <h2>Adventure Awaits</h2>

            </div>

            <div id="adventureContainer" class="row g-4">
            </div>

            <div class="section-title">

                <h2> Cultural Gems </h2>

            </div>

            <div id="culturalContainer" class="row g-4"> </div>


        </div>

    </section>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>


</body>

</html>
